name: Backend CI

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  workflow_dispatch:

# The workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Install and check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Looks at the whole repository, not just backend/.
      - name: Make sure no secrets are committed
        working-directory: .
        run: |
          if git ls-files | grep -E '(^|/)(\.env|Fuelix\.txt|request\.txt|payload\.txt)$|keen-tokenizer-.*\.json$|(^|/)\.session/|(^|/)data/browser-profile'; then
            echo "::error::A secrets file, sample log or saved login is tracked by git. Remove it from the repository and rotate any secret in it."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check the code
        run: npm run check

      # Reported as a warning, so a new advisory in a dependency does not block every change.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
