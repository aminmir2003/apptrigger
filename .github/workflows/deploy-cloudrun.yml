name: Deploy apptrigger to Cloud Run

on:
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/scripts/**'
      - '.github/workflows/deploy-cloudrun.yml'

# One deploy at a time. A newer push waits instead of cancelling a deploy that is half done.
concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

permissions:
  contents: read

# ─── Required GitHub Secrets (Settings > Secrets and variables > Actions) ─────────────────────────
# Google Cloud
#   GCP_SA_KEY               Service account JSON key used to deploy. Needs: Cloud Run Admin,
#                            Artifact Registry Writer, Service Account User.
#   GCP_PROJECT_ID           Project the services are deployed to.
#   GCP_REGION               Region, e.g. "northamerica-northeast1".
#   AR_REPOSITORY            Artifact Registry (Docker) repository name, e.g. "apptrigger".
#   LOGS_PROJECT_ID          (optional) Project whose Cloud Logging is read. Defaults to GCP_PROJECT_ID.
#                            The backend runs as the Cloud Run runtime service account, which needs the
#                            "Logs Viewer" role (roles/logging.viewer) on that project.
#
# Reading logs for the NP / PR switch (optional; each side has its own service account)
#   LOGS_PROJECT_ID_NP       Project behind the NP button, e.g. "cio-notification-np-93822f".
#                            (A project id is not secret: it may be a Secret or a repository Variable.)
#   LOGS_SA_KEY_NP           JSON key of the service account that reads the NP logs (paste the whole key file).
#                            MUST be a Secret. A Variable is stored as plain text, is visible to everyone who can open
#                            the repository settings, and is not hidden in workflow logs; the workflow ignores it.
#   LOGS_PROJECT_ID_PR       Project behind the PR button, e.g. "cio-notification-pr-64911f" (Secret or Variable).
#   LOGS_SA_KEY_PR           JSON key of the service account that reads the PR logs (a Secret, as above).
#                            Each account needs "Logs Viewer" (roles/logging.viewer) on its own project, and on the
#                            log bucket if the logs are routed to a separate bucket. These are separate from
#                            GCP_SA_KEY above, which only deploys. Set the PROJECT and KEY of a side together; set
#                            neither to keep the single LOGS_PROJECT_ID / GCP_PROJECT_ID behaviour.
#
# FuelIX
#   FUELIX_API_KEY, FUELIX_ENDPOINT, FUELIX_MODEL
#
# Search keys (optional). Without these the backend uses the config.example.json that is built into the image.
#   CONFIG_GITHUB_REPO       owner/repository holding the config file.
#   CONFIG_GITHUB_PATH       path of the file (default apptrigger-config.json).
#   CONFIG_GITHUB_BRANCH     branch (default main).
#   CONFIG_GITHUB_TOKEN      read-only token for a private repo.
#   (Secret names cannot start with GITHUB_, hence the CONFIG_ prefix.)
#
# NOTE: the frontend address is not a secret. It is read from Cloud Run after the frontend is deployed and
#       given to the backend, and the backend address is baked into the frontend build.
#
# ─── Who can reach the deployed app (Settings > Secrets and variables > Actions > Variables) ──────
# apptrigger has NO sign-in. The API returns production log entries (which can hold customer data) and spends the
# FuelIX key, so it must not be open to the internet by accident.
#   PUBLIC_ACCESS            (also accepted under the name _PUBLIC_ACCESS)
#                            Leave unset: both services are deployed PRIVATE (only Google accounts you grant
#                            "Cloud Run Invoker" can call them; a plain browser cannot reach the app).
#                            Set to the word  true  to make both services public (anyone with the link).
#                            Only do that for a short test, or once something else (a login, IAP, a VPN) protects them.
# ─────────────────────────────────────────────────────────────────────────────────────────────────

env:
  BACKEND_SERVICE: apptrigger-backend
  FRONTEND_SERVICE: apptrigger-frontend

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: Deploy the backend (API)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-backend:
    name: Deploy backend to Cloud Run
    runs-on: ubuntu-latest
    # Handed to the scripts as environment variables, never pasted into the script text, so a stray
    # character in a secret cannot break the shell (the format is checked in the first step).
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      AR_REPOSITORY: ${{ secrets.AR_REPOSITORY }}

    outputs:
      backend_url: ${{ steps.get-backend-url.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          AR_REPOSITORY: ${{ secrets.AR_REPOSITORY }}
          FUELIX_API_KEY: ${{ secrets.FUELIX_API_KEY }}
          FUELIX_ENDPOINT: ${{ secrets.FUELIX_ENDPOINT }}
          FUELIX_MODEL: ${{ secrets.FUELIX_MODEL }}
        run: |
          missing=""
          for name in GCP_SA_KEY GCP_PROJECT_ID GCP_REGION AR_REPOSITORY FUELIX_API_KEY FUELIX_ENDPOINT FUELIX_MODEL; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub secret(s):$missing — set them under Settings > Secrets and variables > Actions."
            exit 1
          fi

          # Format checks. A value pasted with a space, bracket or line break, for example
          # "northamerica-northeast1 (Montreal)", would otherwise break the later steps with a confusing shell error.
          region_re='^[a-z]+(-[a-z]+)*[0-9]+$'
          project_re='^[a-z][a-z0-9-]{4,28}[a-z0-9]$'
          repo_re='^[a-z]([a-z0-9-]*[a-z0-9])?$'
          bad=""
          [[ "$GCP_REGION" =~ $region_re ]] || bad="$bad GCP_REGION (like us-central1: lowercase letters, digits and hyphens only)"
          [[ "$GCP_PROJECT_ID" =~ $project_re ]] || bad="$bad GCP_PROJECT_ID (like my-project-123)"
          [[ "$AR_REPOSITORY" =~ $repo_re ]] || bad="$bad AR_REPOSITORY (lowercase letters, digits and hyphens only)"
          if [ -n "$bad" ]; then
            echo "::error::Secret(s) not in the expected format. Check for extra spaces, brackets or a line break:$bad"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push the backend image
        run: |
          IMAGE=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${BACKEND_SERVICE}
          docker build -t ${IMAGE}:${{ github.sha }} -t ${IMAGE}:latest ./backend
          docker push ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest

      # On a redeploy the frontend already exists. Giving its address to the backend now keeps CORS working
      # during the deploy. On the very first run it does not exist yet; the frontend job sets it afterwards.
      - name: Look up the frontend address (if it exists yet)
        id: frontend-url
        run: |
          URL=$(gcloud run services describe ${FRONTEND_SERVICE} --region "${GCP_REGION}" \
            --format 'value(status.url)' 2>/dev/null || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Existing frontend address: ${URL:-none yet}"

      # A key pasted with its first line missing, or the wrong kind of key, would only fail when someone opens the app.
      # This stops the deploy instead. Only the reason is printed, never the key.
      - name: Check the NP / PR log reader settings (if set)
        env:
          LOGS_PROJECT_ID_NP: ${{ vars.LOGS_PROJECT_ID_NP || secrets.LOGS_PROJECT_ID_NP }}
          LOGS_PROJECT_ID_PR: ${{ vars.LOGS_PROJECT_ID_PR || secrets.LOGS_PROJECT_ID_PR }}
          LOGS_SA_KEY_NP: ${{ secrets.LOGS_SA_KEY_NP }}
          LOGS_SA_KEY_PR: ${{ secrets.LOGS_SA_KEY_PR }}
        run: |
          project_re='^[a-z][a-z0-9-]{4,28}[a-z0-9]$'
          for side in NP PR; do
            proj_var="LOGS_PROJECT_ID_$side"; key_var="LOGS_SA_KEY_$side"
            proj="${!proj_var}"; key="${!key_var}"
            if [ -z "$proj" ] && [ -z "$key" ]; then echo "$side: not set, skipped"; continue; fi
            if [ -z "$proj" ]; then echo "::error::$key_var is set but $proj_var is not"; exit 1; fi
            if [ -z "$key" ]; then echo "::error::$proj_var is set but the SECRET $key_var is not. Create it under Settings > Secrets (not Variables: a Variable is plain text and is not used for keys)."; exit 1; fi
            [[ "$proj" =~ $project_re ]] || { echo "::error::$proj_var is not a project id (like my-project-123; check for spaces or a line break)"; exit 1; }
            KEY="$key" node -e '
              let k;
              try { k = JSON.parse(process.env.KEY); } catch { console.log("is not valid JSON (paste the whole key file, starting with {)"); process.exit(1); }
              if (k.type !== "service_account" || !k.client_email || !k.private_key) { console.log("is not a service account key"); process.exit(1); }
              console.log("ok, account " + k.client_email);
            ' > "$RUNNER_TEMP/keycheck.txt" || { echo "::error::$key_var $(cat "$RUNNER_TEMP/keycheck.txt")"; exit 1; }
            echo "$side: project $proj, key $(cat "$RUNNER_TEMP/keycheck.txt")"
          done
          rm -f "$RUNNER_TEMP/keycheck.txt"

      - name: Build the Cloud Run settings file
        env:
          APP_LOGS_PROJECT_ID: ${{ secrets.LOGS_PROJECT_ID || secrets.GCP_PROJECT_ID }}
          APP_LOGS_PROJECT_NP: ${{ vars.LOGS_PROJECT_ID_NP || secrets.LOGS_PROJECT_ID_NP }}
          APP_LOGS_PROJECT_PR: ${{ vars.LOGS_PROJECT_ID_PR || secrets.LOGS_PROJECT_ID_PR }}
          APP_LOGS_SA_KEY_NP: ${{ secrets.LOGS_SA_KEY_NP }}
          APP_LOGS_SA_KEY_PR: ${{ secrets.LOGS_SA_KEY_PR }}
          APP_FUELIX_API_KEY: ${{ secrets.FUELIX_API_KEY }}
          APP_FUELIX_ENDPOINT: ${{ secrets.FUELIX_ENDPOINT }}
          APP_FUELIX_MODEL: ${{ secrets.FUELIX_MODEL }}
          APP_CONFIG_REPO: ${{ secrets.CONFIG_GITHUB_REPO }}
          APP_CONFIG_PATH: ${{ secrets.CONFIG_GITHUB_PATH }}
          APP_CONFIG_BRANCH: ${{ secrets.CONFIG_GITHUB_BRANCH }}
          APP_CONFIG_TOKEN: ${{ secrets.CONFIG_GITHUB_TOKEN }}
          APP_FRONTEND_URL: ${{ steps.frontend-url.outputs.url }}
        run: node .github/scripts/cloudrun-env.mjs "$RUNNER_TEMP/backend-env.yaml"

      - name: Deploy the backend to Cloud Run
        env:
          PUBLIC_ACCESS: ${{ vars.PUBLIC_ACCESS || vars._PUBLIC_ACCESS }}
        run: |
          IMAGE=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${BACKEND_SERVICE}
          # There is no sign-in, so the service is private unless the PUBLIC_ACCESS variable is exactly "true".
          if [ "$PUBLIC_ACCESS" = "true" ]; then
            ACCESS=--allow-unauthenticated
            echo "::warning::PUBLIC_ACCESS=true: the backend is open to anyone with its address (production logs and the FuelIX key are exposed)."
          else
            ACCESS=--no-allow-unauthenticated
          fi
          # --port 8080: the container port Cloud Run forwards to. Cloud Run sets PORT=8080 itself (reserved name).
          # --timeout 300: a large batch of logs can take FuelIX a while.
          gcloud run deploy ${BACKEND_SERVICE} \
            --image ${IMAGE}:${{ github.sha }} \
            --region "${GCP_REGION}" \
            --platform managed \
            ${ACCESS} \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --timeout 300 \
            --env-vars-file "$RUNNER_TEMP/backend-env.yaml"

      - name: Remove the settings file
        if: always()
        run: rm -f "$RUNNER_TEMP/backend-env.yaml"

      - name: Get backend Cloud Run URL
        id: get-backend-url
        run: |
          URL=$(gcloud run services describe ${BACKEND_SERVICE} \
            --region "${GCP_REGION}" \
            --format 'value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Backend deployed at: $URL"

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: Deploy the frontend (runs after the backend)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-frontend:
    name: Deploy frontend to Cloud Run
    runs-on: ubuntu-latest
    needs: deploy-backend
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      AR_REPOSITORY: ${{ secrets.AR_REPOSITORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          AR_REPOSITORY: ${{ secrets.AR_REPOSITORY }}
        run: |
          missing=""
          for name in GCP_SA_KEY GCP_PROJECT_ID GCP_REGION AR_REPOSITORY; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub secret(s):$missing — set them under Settings > Secrets and variables > Actions."
            exit 1
          fi

          # Format checks. A value pasted with a space, bracket or line break, for example
          # "northamerica-northeast1 (Montreal)", would otherwise break the later steps with a confusing shell error.
          region_re='^[a-z]+(-[a-z]+)*[0-9]+$'
          project_re='^[a-z][a-z0-9-]{4,28}[a-z0-9]$'
          repo_re='^[a-z]([a-z0-9-]*[a-z0-9])?$'
          bad=""
          [[ "$GCP_REGION" =~ $region_re ]] || bad="$bad GCP_REGION (like us-central1: lowercase letters, digits and hyphens only)"
          [[ "$GCP_PROJECT_ID" =~ $project_re ]] || bad="$bad GCP_PROJECT_ID (like my-project-123)"
          [[ "$AR_REPOSITORY" =~ $repo_re ]] || bad="$bad AR_REPOSITORY (lowercase letters, digits and hyphens only)"
          if [ -n "$bad" ]; then
            echo "::error::Secret(s) not in the expected format. Check for extra spaces, brackets or a line break:$bad"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push the frontend image
        env:
          BACKEND_URL: ${{ needs.deploy-backend.outputs.backend_url }}
        # VITE_API_URL is baked into the page by Vite at build time (see frontend/src/api.js).
        run: |
          [ -n "$BACKEND_URL" ] || { echo "::error::The backend job did not report its address"; exit 1; }
          IMAGE=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${FRONTEND_SERVICE}
          echo "Building the frontend with VITE_API_URL=${BACKEND_URL}"
          docker build \
            --build-arg VITE_API_URL=${BACKEND_URL} \
            -t ${IMAGE}:${{ github.sha }} \
            -t ${IMAGE}:latest \
            ./frontend
          docker push ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest

      - name: Deploy the frontend to Cloud Run
        env:
          PUBLIC_ACCESS: ${{ vars.PUBLIC_ACCESS || vars._PUBLIC_ACCESS }}
        run: |
          IMAGE=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${FRONTEND_SERVICE}
          # Same rule as the backend: private unless the PUBLIC_ACCESS variable is exactly "true".
          if [ "$PUBLIC_ACCESS" = "true" ]; then ACCESS=--allow-unauthenticated; else ACCESS=--no-allow-unauthenticated; fi
          # No runtime settings: the backend address was baked into the page at build time.
          gcloud run deploy ${FRONTEND_SERVICE} \
            --image ${IMAGE}:${{ github.sha }} \
            --region "${GCP_REGION}" \
            --platform managed \
            ${ACCESS} \
            --port 8080 \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3

      - name: Get frontend Cloud Run URL
        id: get-frontend-url
        run: |
          URL=$(gcloud run services describe ${FRONTEND_SERVICE} \
            --region "${GCP_REGION}" \
            --format 'value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Frontend deployed at: $URL"

      # Needed on the first run (the frontend did not exist when the backend was deployed), harmless after that.
      # Updates only this one setting; everything else on the backend is left as it is.
      - name: Let the backend allow the frontend address
        env:
          FRONTEND_URL: ${{ steps.get-frontend-url.outputs.url }}
          PUBLIC_ACCESS: ${{ vars.PUBLIC_ACCESS || vars._PUBLIC_ACCESS }}
        run: |
          gcloud run services update ${BACKEND_SERVICE} \
            --region "${GCP_REGION}" \
            --update-env-vars "FRONTEND_ORIGIN=${FRONTEND_URL}"
          if [ "$PUBLIC_ACCESS" = "true" ]; then
            echo "Open the app at: ${FRONTEND_URL}"
          else
            echo "::notice::Both services are PRIVATE (the PUBLIC_ACCESS variable is not 'true'), so ${FRONTEND_URL} will answer 403 in a plain browser."
          fi
